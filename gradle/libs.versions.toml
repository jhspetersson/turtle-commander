[versions]
# libraries
junit = "4.13.2"
opentest4j = "1.3.0"
commonsCompress = "1.28.0"
zstdJni = "1.5.7-16"
isoFileReader = "1.4.0"
junrar = "8.1.1"
cab4j = "0.1.3"

# plugins
changelog = "2.5.0"
intelliJPlatform = "2.18.1"
kotlin = "2.4.10"
kover = "0.9.9"
qodana = "2026.2.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }
commonsCompress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
zstdJni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstdJni" }
isoFileReader = { group = "com.palantir.isofilereader", name = "isofilereader", version.ref = "isoFileReader" }
junrar = { group = "com.github.junrar", name = "junrar", version.ref = "junrar" }
cab4j = { group = "de.morihofi.cab4j", name = "cab4j", version.ref = "cab4j" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
